site_name: PPE Training Pipeline
site_description: Vision-based PPE compliance monitoring for construction sites
docs_dir: docs
use_directory_urls: true

theme:
    name: material
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: teal
          accent: teal
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: teal
          accent: teal
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
    font:
        text: Inter
        code: JetBrains Mono
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - navigation.tracking
        - navigation.indexes
        - navigation.footer
        - toc.follow
        - search.highlight
        - search.suggest
        - content.code.copy
        - content.code.annotate
        - content.tooltips

plugins:
    - search
    - git-revision-date-localized:
          type: date
          enable_creation_date: true
    - git-authors:
          show_contribution: false
          show_email_address: false

markdown_extensions:
    - abbr
    - admonition
    - attr_list
    # Math for the Knowledge pages. generic mode rewrites $..$ and $$..$$ into
    # MathJax delimiters, rendered by the scripts in extra_javascript below.
    - pymdownx.arithmatex:
          generic: true
    - def_list
    - footnotes
    - md_in_html
    - tables
    - toc:
          permalink: true
    - pymdownx.details
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
    - pymdownx.inlinehilite
    - pymdownx.keys
    - pymdownx.mark
    - pymdownx.snippets:
          auto_append:
              - includes/abbreviations.md
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.tasklist:
          custom_checkbox: true
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.critic
    - pymdownx.caret
    - pymdownx.tilde

extra_javascript:
    - javascripts/mathjax.js
    - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
    - Home: index.md
    - Knowledge:
          - knowledge/index.md
          - Object detection: knowledge/object-detection.md
          - Precision, recall, F1: knowledge/precision-recall.md
          - YOLO: knowledge/yolo.md
          - Ultralytics: knowledge/ultralytics.md
          - Multi-object tracking: knowledge/multi-object-tracking.md
    - Architecture: architecture.md
    - Pipeline:
          - Stages: pipeline/stages.md
          - Detector: pipeline/detector.md
          - Tracking & association: pipeline/tracking.md
          - Compliance state: pipeline/compliance.md
          - Configuration: pipeline/config.md
          - PPE vocabulary: pipeline/vocabulary.md
          - Event schema: pipeline/schemas.md
    - Decisions:
          - decisions/README.md
          - "0001 Positive-only detection & compliance logic": decisions/0001-positive-only-detection.md
          - Template: decisions/template.md
